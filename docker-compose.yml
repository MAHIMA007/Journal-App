services:
  db:
    image: pgvector/pgvector:pg16
    container_name: memoir-db
    environment:
      POSTGRES_USER: memoir
      POSTGRES_PASSWORD: memoir_secure_pw
      POSTGRES_DB: memoir
    ports:
      - "5432:5432"
    volumes:
      - memoir_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memoir -d memoir"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama
    container_name: memoir-ollama
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_NUM_PARALLEL=1
    cpus: 2
    mem_limit: 4g
    volumes:
      - ollama_data:/root/.ollama
    # Uncomment to auto-pull models on startup (takes time)
    # entrypoint: ["sh", "-c", "ollama serve & sleep 2 && ollama pull mistral && ollama pull nomic-embed-text && wait"]

  redis:
    image: redis:7-alpine
    container_name: memoir-redis
    command: redis-server --appendonly yes
    volumes:
      - memoir_redis_data:/data

  app:
    image: memoir:latest
    container_name: memoir-app
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started
      redis:
        condition: service_started
    environment:
      PORT: 3001
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: memoir
      DB_PASSWORD: memoir_secure_pw
      DB_NAME: memoir
      OLLAMA_URL: http://ollama:11434/api
      OLLAMA_MODEL: mistral
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "5173:3001"
      - "3001:3001"

volumes:
  memoir_pgdata:
  ollama_data:
  memoir_redis_data:
